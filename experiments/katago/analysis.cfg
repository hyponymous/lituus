# Minimal analysis-engine config for the lituus point-loss experiment.
# Deliberately small and explicit: every knob that could change a score is
# set here rather than inherited from a distribution's example config.

# Score and winrate are reported for the player to move, which makes
# point loss a plain subtraction (best - played) with no sign juggling.
reportAnalysisWinratesAs = SIDETOMOVE

numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 32

# Deterministic: two runs of the same config must produce the same numbers,
# or the comparison measures search noise instead of network quality.
nnRandomize = false
